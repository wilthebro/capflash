<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapFlash — Free TikTok-style captions, generated in your browser</title>
    <meta
      name="description"
      content="Free TikTok-style caption generator that runs entirely in your browser: no upload, no watermark, no account. Transcribe, style and burn captions into an MP4."
    />
    <meta name="theme-color" content="#141518" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      These are static on purpose: no social scraper runs JavaScript, so setting
      them from the app would achieve nothing. The per-route <title> and
      description are set at runtime, and the canonical is computed there too —
      one index.html serves every route, so a static canonical would mark
      /privacy and /terms as duplicates of this page.

      The name and origin below are repeated from src/site/config.ts, which this
      file cannot read. If either changes, change it in both — and in
      public/sitemap.xml and public/robots.txt, which have the same problem.

      The og:image is public/og-image.png (1200x630), referenced by absolute URL
      below because scrapers do not resolve relative ones. Swap the file to
      change it; only the dimensions need to stay 1200x630. Social platforms
      cache previews hard, so force a re-fetch after changing it.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CapFlash" />
    <meta
      property="og:title"
      content="CapFlash — Free TikTok-style captions, generated in your browser"
    />
    <meta
      property="og:description"
      content="Free TikTok-style caption generator that runs entirely in your browser: no upload, no watermark, no account. Transcribe, style and burn captions into an MP4."
    />
    <meta property="og:url" content="https://capflash.app/" />
    <!-- Absolute, not a relative path: scrapers do not resolve relative URLs, and
         a relative og:image silently produces no preview image at all. This file
         is public/og-image.png, served from the site root. -->
    <meta property="og:image" content="https://capflash.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CapFlash — free TikTok-style captions, generated in your browser"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="CapFlash — Free TikTok-style captions, generated in your browser"
    />
    <meta
      name="twitter:description"
      content="Free TikTok-style caption generator that runs entirely in your browser: no upload, no watermark, no account."
    />
    <meta name="twitter:image" content="https://capflash.app/og-image.png" />

    <!--
      AdSense site review looks for the loader in the served HTML, so paste the
      snippet AdSense gives you here, uncommented and with your own client id:

      <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
        crossorigin="anonymous"></script>

      The ad rail injects this script itself when it is missing, so ads serve
      either way — this is here so the review crawler finds it in the source.
      You still need the ad unit itself: see "Ad rail" in README.md.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
